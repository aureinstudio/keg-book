name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Vercel과 동일한 빌드를 한번 더 검증 (env 없이도 통과해야 함)
      - name: Production build
        run: npm run build
        env:
          # 빌드 시 필요한 최소 더미 env. 실제 시크릿은 Vercel에서 주입됨.
          AUTH_SECRET: ci-dummy-secret-do-not-use
